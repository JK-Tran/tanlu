name: tanlu_management
description: "A new Flutter project."
publish_to: "none" 

version: 1.0.0+4

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^8.0.2
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.0.3
  video_player: ^2.8.2
  chewie: ^1.11.3
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.0
  gal: ^2.3.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  device_info_plus: ^11.3.0
  package_info_plus: ^8.0.0
  firebase_core: ^4.4.0
  google_sign_in: ^7.1.1
  firebase_auth: ^6.1.4
  lottie: ^3.1.3
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.3.0
  injectable: ^2.7.1+4
  bloc: ^8.1.4
  async: ^2.13.1
  meta: ^1.17.0
  flutter_screenutil: ^5.9.3
  flame_audio: ^2.12.1
  audioplayers: ^6.6.0
  flutter_svg: ^2.0.10+1
  path_drawing: ^1.0.1
  xml: ^6.5.0
  flutter_tts: ^4.1.0
  provider: ^6.1.5+1
  clock: ^1.1.2
  file_picker: ^11.0.2
  easy_refresh: ^3.5.0
  shimmer: ^3.0.0
  animated_bottom_navigation_bar: ^1.4.0
  dropdown_button2: ^3.1.0
  flutter_native_splash: ^2.4.7
  socket_io_client: ^3.1.4
  collection: ^1.19.1
  image_picker: ^1.2.2
  photo_manager: ^3.9.0
  dotted_line: ^3.3.0
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.5
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0
  firebase_app_check: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-tanlu.png"
  adaptive_icon_background: "#E84B4B"
  adaptive_icon_foreground: "assets/images/logo-tanlu.png"
  remove_alpha_ios: true

# Native splash (Android + iOS). Sau khi sửa chạy: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo-tanlu.png"
  android_12:
    image: "assets/images/logo-tanlu.png"
    color: "#FFFFFF"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/overview/
