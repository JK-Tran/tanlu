name: tanlu_management
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^8.0.2
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.0.3
  video_player: ^2.8.2
  url_launcher: ^6.3.0
  gal: ^2.3.2
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  device_info_plus: ^11.3.0
  package_info_plus: ^8.0.0
  firebase_core: ^4.4.0
  google_sign_in: ^7.1.1
  firebase_auth: ^6.1.4
  lottie: ^3.1.3
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^6.3.0
  injectable: ^2.7.1+4
  bloc: ^8.1.4
  async: ^2.13.1
  meta: ^1.17.0
  flutter_screenutil: ^5.9.3
  flame_audio: ^2.12.1
  audioplayers: ^6.6.0
  flutter_svg: ^2.0.10+1
  path_drawing: ^1.0.1
  xml: ^6.5.0
  flutter_tts: ^4.1.0
  provider: ^6.1.5+1
  clock: ^1.1.2
  file_picker: ^11.0.2
  easy_refresh: ^3.5.0
  shimmer: ^3.0.0
  animated_bottom_navigation_bar: ^1.4.0
  dropdown_button2: ^3.1.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: "adaptive"
  ios: true
  image_path: "assets/images/playstore.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/playstore.png"
  remove_alpha_ios: true

# Native splash (Android + iOS). Sau khi sửa chạy: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/tanlu-splash.png"
  android_12:
    image: "assets/images/tanlu-splash.png"
    color: "#ffffff"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
